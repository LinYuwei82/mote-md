# 小兔在线官网 · nginx 站点配置
# 目标：/etc/nginx/sites-available/xiaotu.conf（Debian 13，nginx 1.26）
# 前置：站点文件放在 /var/www/xiaotu，属主 www-data；备案通过后用 certbot 签证书。
#
# 备案未通过前，80 端口对外会被拦截，本文件可以先部署，备案通过后再执行：
#   sudo certbot --nginx -d xiaotu.online -d www.xiaotu.online
# certbot 会自动补 443 server 块和 HTTP→HTTPS 跳转，其余指令保持不变。

server {
    listen 80;
    listen [::]:80;
    server_name xiaotu.online www.xiaotu.online;

    root /var/www/xiaotu;
    index index.html;
    charset utf-8;
    server_tokens off;

    # 静态站没有上传、没有表单，请求体一律拒绝
    client_max_body_size 1m;

    error_page 404 /404.html;
    location = /404.html { internal; }

    # 图片、样式、脚本：文件名不含哈希，缓存 7 天，不用 immutable
    location ~* \.(?:css|js|png|jpe?g|svg|ico)$ {
        expires 7d;
    }

    # HTML 每次回源校验，避免发版后看到旧页面
    location ~* \.html$ {
        expires epoch;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css application/javascript text/html application/xml image/svg+xml application/json;

    # 安全响应头：页面内的下载清单请求只允许 dl.xiaotu.online
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self'; style-src 'self'; script-src 'self'; connect-src 'self' https://dl.xiaotu.online; base-uri 'none'; form-action 'none'; frame-ancestors 'none'; object-src 'none'" always;
}
