name: Windows 发布

# 手动触发的 Windows 发布流水线：构建原生外壳 → 绿色包/安装包 → guard 门禁
# → 生成 manifest.json（含 notes_url）→ 上传 OSS → 线上校验
# → 创建 GitHub / Gitee Release（dry_run 跳过上传与 Release）。
#
# 前置 secrets：OSS_ACCESS_KEY_ID / OSS_ACCESS_KEY_SECRET（仅授予 PutObject）、
# MOTE_UPDATE_SIGNING_KEY、GITEE_TOKEN（Gitee releases + 附件上传权限）。
# 注意：发布前先改仓库根 VERSION.txt（必须大于线上版本）；guard 会拒绝版本回退，
# 安装包 immutable 长缓存，同名覆盖不会生效。

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      channel:
        description: 发布通道
        type: choice
        options: [stable, beta]
        default: stable
      build:
        description: "手动构建号（正式发布请用 tag v<semver>+<seq>）"
        type: string
        default: ""
      skip_setup:
        description: 只发绿色包（跳过安装包）
        type: boolean
        default: false
      dry_run:
        description: 只出包与清单，不上传 OSS
        type: boolean
        default: false

permissions:
  contents: write   # 创建/更新 GitHub Release 需要写权限（Gitee 走 GITEE_TOKEN）

# Windows 英文 runner 默认 cp1252，Python 打印中文会崩；统一 UTF-8 输出
env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: utf-8

jobs:
  release:
    name: 构建 → 门禁 → 上传
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # guard 是三仓库共用的单一规则源（见 mote/docs/OSS-发布布局.md）
      # Windows 检出可能把哈希文件转成 CRLF，先去掉 \r 再校验
      - name: 校验 guard / manifest_v2 未被单独改动
        shell: bash
        run: |
          tr -d '\r' < tools/release/guard.sha256 | sha256sum -c -
          tr -d '\r' < tools/release/manifest_v2.sha256 | sha256sum -c -
      - name: guard / manifest_v2 selftest
        shell: pwsh
        run: |
          python tools/release/guard.py selftest
          python tools/release/manifest_v2.py selftest

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # 原生外壳链接 WebView2LoaderStatic.lib：按固定版本取 nuget 包，
      # 解出 build/native/include 与 x64 静态库，路径通过 WEBVIEW2_SDK 传给 CMake。
      - name: 取 WebView2 SDK
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $v = '1.0.4314.35'
          $url = "https://api.nuget.org/v3-flatcontainer/microsoft.web.webview2/$v/microsoft.web.webview2.$v.nupkg"
          $nupkg = Join-Path $env:RUNNER_TEMP "webview2.$v.nupkg"
          $dest = Join-Path $env:RUNNER_TEMP "webview2sdk\pkg"
          Invoke-WebRequest -Uri $url -OutFile $nupkg -UseBasicParsing
          New-Item -ItemType Directory -Force $dest | Out-Null
          Expand-Archive -LiteralPath $nupkg -DestinationPath $dest -Force
          if (-not (Test-Path (Join-Path $dest 'build\native\include\WebView2.h'))) {
            throw 'WebView2 SDK 解压后缺少 WebView2.h'
          }
          "WEBVIEW2_SDK=$dest" | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Host "WebView2 SDK $v → $dest"

      - name: 构建原生外壳
        run: |
          # 构建号：正式发布由 tag v<semver>+<seq> 决定（build = 序号，从 1 起，无固定基数）；
          # 手动触发必须显式给 build，避免出现不由发布记录决定的构建号。
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            $parsed = python tools\release\release_tag.py parse --ensure-latest --tag $env:GITHUB_REF_NAME --emit sh
            if ($LASTEXITCODE -ne 0) { throw "tag 解析失败：$env:GITHUB_REF_NAME" }
            foreach ($line in $parsed) {
              $kv = $line -split '=', 2
              if ($kv.Count -eq 2) { Set-Item -Path "Env:$($kv[0])" -Value $kv[1] }
            }
            $build = $env:BUILD
            Write-Host "构建号来自 tag：$env:GITHUB_REF_NAME → $build"
          } else {
            $build = '${{ inputs.build }}'
            if (-not $build) { throw '手动触发必须提供 build 参数；正式发布请用 tag v<semver>+<seq>' }
          }
          # 附加 git short hash 到二进制 stamp（用于追溯：build + commit）
          $buildHash = (git rev-parse --short HEAD 2>$null)
          if ($LASTEXITCODE -ne 0) { $buildHash = "" }
          Write-Host "构建号: $build  hash: $buildHash"
          # 构建前先校验版本 / 构建号递增（对照线上清单）
          $channel = '${{ inputs.channel || 'stable' }}'
          if (-not $channel) { $channel = 'stable' }
          python tools\release\check_version_bump.py --product mote --build $build `
            --platform windows `
            --manifest-url "https://dl.xiaotu.online/mote/updates/$channel/manifest.json"
          if ($LASTEXITCODE -ne 0) { throw '版本/构建号递增校验失败' }
          # 参数整体加引号：不引号时 PowerShell 会把 -DMOTE_BUILD=$build 原样传给 cmake
          # -DMOTE_RELEASE_BUILD=ON：发布构建，缺 Sparkle.framework 或缺构建号时 FATAL_ERROR
          $buildHashArg = if ($buildHash) { "-DMOTE_BUILD_HASH=$buildHash" } else { "" }
          cmake -S native --preset windows-release "-DMOTE_BUILD=$build" $buildHashArg -DMOTE_RELEASE_BUILD=ON
          $cache = Get-Content build/windows/CMakeCache.txt -Raw
          $stamped = [regex]::Match($cache, 'MOTE_BUILD:[A-Z]+=(\d+)').Groups[1].Value
          Write-Host "cache 中的构建号: $stamped"
          if ($stamped -notmatch '^\d+$') { throw "MOTE_BUILD 未生效: '$stamped'" }
          # 清单必须写同一个构建号：发布步骤是另一个进程，默认值会取「发布时刻」，
          # 比二进制新，客户端会反复提示同一个版本
          "MOTE_BUILD_STAMP=$stamped" | Out-File -FilePath $env:GITHUB_ENV -Append
          cmake --build build/windows

      - name: 打绿色包
        shell: pwsh
        run: ./tools/package/package_windows.ps1 -SkipBuild

      - name: 打安装包
        if: ${{ inputs.skip_setup != true }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          choco install innosetup --yes --no-progress
          ./packaging/build_installer.ps1

      # guard.py 需要 innounp 解包 setup.exe 做 build stamp 校验
      # 原版 innounp 0.50 只支持 ISCC ≤ 6.1，innounp-2 fork 支持 6.7+
      - name: 安装 innounp
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $url = "https://raw.githubusercontent.com/jrathlev/InnoUnpacker-Windows-GUI/master/innounp-2/bin/innounp-2.zip"
          $dest = Join-Path $env:RUNNER_TEMP 'innounp'
          New-Item -ItemType Directory -Force $dest | Out-Null
          $zip = Join-Path $dest 'innounp.zip'
          Invoke-WebRequest -Uri $url -OutFile $zip -UseBasicParsing
          Expand-Archive -Path $zip -DestinationPath $dest -Force
          $exe = Join-Path $dest 'innounp.exe'
          if (-not (Test-Path $exe)) { throw "innounp 解包后未找到 innounp.exe" }
          $localBin = Join-Path $HOME '.local-bin'
          New-Item -ItemType Directory -Force $localBin | Out-Null
          Copy-Item $exe $localBin
          $localBin | Out-File -FilePath $env:GITHUB_PATH -Append
          & $exe 2>&1 | Select-Object -First 1
          Write-Host "innounp 已部署到 $localBin"

      # publish_windows.ps1 内置 manifest_v2 生成 + guard preflight / verify-live
      - name: 发布（清单 → guard → 上传）
        shell: pwsh
        env:
          OSS_ACCESS_KEY_ID: ${{ secrets.OSS_ACCESS_KEY_ID }}
          OSS_ACCESS_KEY_SECRET: ${{ secrets.OSS_ACCESS_KEY_SECRET }}
          OSS_BUCKET: xiaotu-update-sz
          OSS_REGION: cn-shenzhen
          MOTE_UPDATE_SIGNING_KEY: ${{ secrets.MOTE_UPDATE_SIGNING_KEY }}
        run: |
          python -m pip install --quiet oss2
          $dry = '${{ inputs.dry_run }}' -eq 'true'
          if ('${{ inputs.skip_setup }}' -eq 'true') {
            ./tools/release/publish_windows.ps1 -Channel ${{ inputs.channel || 'stable' }} -Build $env:MOTE_BUILD_STAMP -SetupPath '不存在.exe' -SkipUpload:$dry
          } else {
            ./tools/release/publish_windows.ps1 -Channel ${{ inputs.channel || 'stable' }} -Build $env:MOTE_BUILD_STAMP -SkipUpload:$dry
          }

      # 与 OSS 发布同一版本：GitHub 用工作流 token，Gitee 用 secret GITEE_TOKEN。
      # macOS dmg 若已在 OSS（本地未留档）会自动回源；单平台发版时缺的附件跳过。
      - name: 创建 GitHub / Gitee Release
        if: ${{ inputs.dry_run != true }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          REQUIRE_GITEE: "true"
          ALLOW_MISSING_ATTACHMENTS: "true"
          SKIP_TAG_PUSH: "true"
        run: bash tools/release/publish_release.sh

      - name: 上传构建产物（留档）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Mote-windows-release
          path: |
            dist/Mote-Windows.zip
            dist/Mote-Setup-*.exe
            dist/manifest.json
          if-no-files-found: warn
          retention-days: 14
