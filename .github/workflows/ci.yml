name: CI

# 每次 push / PR 都跑一遍 Windows 构建与单元测试。
# 发布走 release-windows.yml（手动触发，含打包与上传），这里只做回归验证。

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Windows 英文 runner 默认 cp1252，Python 打印中文会崩；统一 UTF-8 输出
env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: utf-8

jobs:
  windows:
    name: Windows 构建与测试
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # guard 是三仓库共用的单一规则源（见 docs/OSS-发布布局.md）
      # Windows 检出可能把哈希文件转成 CRLF，先去掉 \r 再校验
      - name: 校验 guard / manifest_v2 未被单独改动
        shell: bash
        run: |
          tr -d '\r' < tools/release/guard.sha256 | sha256sum -c -
          tr -d '\r' < tools/release/manifest_v2.sha256 | sha256sum -c -

      - name: guard / manifest_v2 selftest
        shell: bash
        run: |
          python3 tools/release/guard.py selftest
          python3 tools/release/manifest_v2.py selftest
          python3 tools/release/test_release_layout.py
          for t in test_release_tag test_version_bump test_guard test_guard_manifest test_publish_release; do
            python3 tools/release/$t.py
          done

      # 前端源码在 resources/web/src/，editor.js / editor.css 由构建期拼接生成。
      - name: 前端纯函数测试
        shell: bash
        run: node tools/editor/test_pure.js

      - name: 前端事件级测试
        shell: bash
        run: node tools/editor/test_events.js

      - name: 前端分片完整性
        shell: bash
        run: |
          python3 tools/editor/split_editor.py status
          python3 tools/editor/split_editor.py status --target css

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # 原生外壳链接 WebView2LoaderStatic.lib：按固定版本取 nuget 包，
      # 解出 build/native/include 与 x64 静态库，路径通过 WEBVIEW2_SDK 传给 CMake。
      - name: 取 WebView2 SDK
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $v = '1.0.4314.35'
          $url = "https://api.nuget.org/v3-flatcontainer/microsoft.web.webview2/$v/microsoft.web.webview2.$v.nupkg"
          $nupkg = Join-Path $env:RUNNER_TEMP "webview2.$v.nupkg"
          $dest = Join-Path $env:RUNNER_TEMP "webview2sdk\pkg"
          Invoke-WebRequest -Uri $url -OutFile $nupkg -UseBasicParsing
          New-Item -ItemType Directory -Force $dest | Out-Null
          Expand-Archive -LiteralPath $nupkg -DestinationPath $dest -Force
          if (-not (Test-Path (Join-Path $dest 'build\native\include\WebView2.h'))) {
            throw 'WebView2 SDK 解压后缺少 WebView2.h'
          }
          "WEBVIEW2_SDK=$dest" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: 构建
        run: |
          $build = (Get-Date).ToUniversalTime().ToString('yyyyMMddHHmm')
          if (-not $build) { throw '构建号为空' }
          $buildHash = (git rev-parse --short HEAD 2>$null)
          if ($LASTEXITCODE -ne 0) { $buildHash = "" }
          Write-Host "构建号: $build  hash: $buildHash"
          # 参数整体加引号：不引号时 PowerShell 会把 -DMOTE_BUILD=$build 原样传给 cmake
          # -DMOTE_RELEASE_BUILD=ON：Sparkle.framework 缺失时 FATAL_ERROR（macOS 生效，Windows 无害）
          $buildHashArg = if ($buildHash) { "-DMOTE_BUILD_HASH=$buildHash" } else { "" }
          cmake -S native --preset windows-release "-DMOTE_BUILD=$build" $buildHashArg -DMOTE_RELEASE_BUILD=ON
          cmake --build build/windows

      - name: 确认构建号已进入 CMake
        run: |
          $cache = Get-Content build/windows/CMakeCache.txt -Raw
          $stamped = [regex]::Match($cache, 'MOTE_BUILD:[A-Z]+=(\d+)').Groups[1].Value
          Write-Host "cache 中的构建号: $stamped"
          if ($stamped -notmatch '^\d{12}$') { throw "MOTE_BUILD 未生效: '$stamped'" }

      - name: 单元测试
        run: ctest --test-dir build/windows --output-on-failure

      - name: 校验构建期前端 bundle
        shell: bash
        run: |
          python3 tools/editor/split_editor.py bundle --out build/editor.expected.js
          python3 tools/editor/split_editor.py bundle --target css --out build/editor.expected.css
          python3 - <<'PY'
          from pathlib import Path
          pairs = [
              ('build/editor.expected.js', 'build/windows/web/editor.js'),
              ('build/editor.expected.css', 'build/windows/web/editor.css'),
          ]
          for expected_path, actual_path in pairs:
              expected = Path(expected_path).read_bytes()
              actual = Path(actual_path).read_bytes()
              if expected != actual and expected.replace(b'\r\n', b'\n') != actual.replace(b'\r\n', b'\n'):
                  raise SystemExit(f'构建期 {Path(actual_path).name} 与 src 拼接结果不一致')
              print(f'构建期 {Path(actual_path).name} 与 src 拼接结果一致')
          PY
